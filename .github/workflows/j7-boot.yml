name: j7-boot

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Run id of an xnu workflow run built with machine_config A5XELTE (the number in its URL)"
        required: true
      cmdline:
        description: "XNU boot-args (cpus=8 needs the kernel built with 0304; cpus=4 = boot cluster only; add emmcfast=1 for 0305)"
        default: "debug=0xc serial=3 cpus=8 keepsyms=1 -noprogress"

jobs:
  boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Kernel from the xnu run
        uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: kernel
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Loader
        run: |
          CC=aarch64-linux-gnu-gcc LD=aarch64-linux-gnu-ld OBJCOPY=aarch64-linux-gnu-objcopy \
            sh shim/j7prime/build-xnu-boot.sh
      - name: ADT, embedded payload and boot image
        run: |
          set -euxo pipefail
          mkdir -p out
          ls -l kernel
          python3 tools/mkadt_j7prime.py out/j7prime.adt
          python3 tools/mkpayload.py kernel/kernel.development.a5xelte out/j7prime.adt out/payload.bin --cmdline "${{ inputs.cmdline }}"
          python3 tools/mkembeddedkernel.py shim/j7prime/outxnu/Image out/payload.bin out/embedded-kernel.Image
          python3 tools/mkdtbh.py -o out/dt.img device/on7xelte.dtb
          python3 tools/mkj7img.py --kernel out/embedded-kernel.Image --dt out/dt.img --name j7xnu -o out/j7-xnu-boot.img
          echo '--- component sizes ---'
          stat -c '%n %s bytes' shim/j7prime/outxnu/Image out/payload.bin out/embedded-kernel.Image out/dt.img out/j7-xnu-boot.img
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p = Path('out/embedded-kernel.Image').read_bytes()
          assert p[56:60] == b'ARMd'
          assert p[0x2000:0x2008] == b'J7XNPAY1'
          payload_len = struct.unpack_from('<Q', p, 0x2008)[0]
          assert payload_len == len(Path('out/payload.bin').read_bytes())
          assert struct.unpack_from('<Q', p, 16)[0] > len(p)
          assert len(p) < 32 * 1024 * 1024
          print(f'embedded wrapper OK; payload={payload_len} bytes; image_size={struct.unpack_from("<Q", p, 16)[0]}')
          PY
          test "$(stat -c %s out/j7-xnu-boot.img)" -lt 33554432
      - uses: actions/upload-artifact@v4
        with:
          name: j7-xnu-boot
          path: |
            out/j7-xnu-boot.img
            out/j7prime.adt
            out/embedded-kernel.Image
            out/payload.bin
