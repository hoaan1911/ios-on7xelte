name: mesa-build

# Cross-builds Mesa's Panfrost gallium driver (Mali Midgard, GLES) as static libraries for iOS 16
# arm64 on a GitHub macOS runner, with the Panfrost DRM emulation (tools/sweetgl-mali) compiled
# alongside. First attempt: expect a few rounds; every run uploads the logs either way (ninja -k 0
# collects every compile error in one go). The next step links it into /usr/lib/sweetgl.dylib.
on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: "Mesa git tag (the survey was taken on mesa-24.3.4)"
        default: "mesa-24.3.4"

jobs:
  build:
    # macos-14 (the last image with Xcode 15.x) was retired on 2026-11-02: jobs on that label fail before
    # the first step ("The configuration 'macos-14-arm64-us-default' is not supported"). macos-15 is arm64
    # and ships Xcode 16.x; nothing here runs target code on the runner, it cross-compiles for iphoneos.
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and tools
        run: |
          set -euo pipefail
          # Pin the newest Xcode 16.x: it is the closest to the iOS 16 SDK this port targets, and pinning keeps
          # a later image (macos-26, Xcode 26.x) from changing the toolchain under the build.
          x=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$x" ]; then
            echo "::error::no Xcode 16.x on this runner (macos-15 ships 16.0-16.4)"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$x"
          echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version | head -1
          brew install ninja bison flex
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet meson mako pyyaml packaging
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Clone and patch Mesa
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.mesa_ref || 'mesa-24.3.4' }}" https://gitlab.freedesktop.org/mesa/mesa.git mesa
          python3 tools/sweetgl-mali/patch-mesa.py mesa
          python3 tools/sweetgl-mali/patch-osmesa.py mesa
      - name: Configure
        run: |
          set -euo pipefail
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          bin=$(dirname "$(xcrun --sdk iphoneos -f clang)")
          sed -e "s#@CLANG@#$(xcrun --sdk iphoneos -f clang)#" -e "s#@CLANGXX@#$(xcrun --sdk iphoneos -f clang++)#" \
              -e "s#@SDK@#$sdk#g" -e "s#@AR@#$bin/ar#" -e "s#@STRIP@#$bin/strip#" \
              -e "s#@INC@#$PWD/tools/sweetgl-mali/include#g" tools/sweetgl-mali/ios-cross.txt.in > ios-cross.txt
          cat ios-cross.txt
          cd mesa
          opts=$(python3 ../tools/sweetgl-mali/mesa-opts.py . \
            -Dplatforms= -Degl=disabled -Dglx=disabled -Dgbm=disabled \
            -Dgallium-drivers=panfrost,softpipe -Dvulkan-drivers= -Dosmesa=true \
            -Dllvm=disabled -Dgles1=disabled -Dgles2=enabled -Dopengl=true \
            -Dzstd=disabled -Dzlib=disabled -Dexpat=disabled -Dxmlconfig=disabled \
            -Dvalgrind=disabled -Dlibunwind=disabled -Dlmsensors=disabled \
            -Dbuild-tests=false -Dshader-cache=disabled -Dperfetto=false \
            -Dgallium-va=disabled -Dgallium-rusticl=false -Dtools= \
            -Dhtml-docs=disabled -Ddisplay-info=disabled -Dteflon=false)
          echo "$opts"
          meson setup ../build --cross-file ../ios-cross.txt \
            --buildtype=release -Db_ndebug=true -Ddefault_library=static $opts
      - name: Build every Mesa library
        run: |
          set -o pipefail
          # no EGL/DRI target exists, so the state tracker, gallium auxiliary and compiler libraries are
          # not part of "all": ask for every static/shared library meson knows about.
          meson introspect build --targets | python3 tools/sweetgl-mali/lib-targets.py > targets.txt
          wc -w targets.txt
          ninja -C build -k 0 $(cat targets.txt) 2>&1 | tee ninja.log | tail -40
      - name: Compile the Panfrost DRM emulation for iOS
        if: always()
        run: |
          set -euo pipefail
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra -Wno-unused-parameter \
            -I tools/sweetgl-mali/include -I tools/sweetgl-mali -I mesa/include \
            -c tools/sweetgl-mali/sweet_drm_mali.c -o sweet_drm_mali.o
          ls -l sweet_drm_mali.o
          # the four symbols only unreachable paths reference (see the file)
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -Wextra \
            -c tools/sweetgl-mali/mesa-stubs.c -o mesa-stubs.o
          ls -l mesa-stubs.o
      - name: Link check (every object, so every missing symbol is listed)
        if: always()
        run: |
          set +e
          libs=$(find build -name '*.a' | sort)
          echo "$libs" | wc -l
          # The GL dispatch (_glapi_*) lives in the shared glapi library, which this link of static
          # archives does not include: take its objects, so one dylib holds everything.
          glapi=$(find build/src/mapi/shared-glapi -name '*.o' | sort)
          echo "glapi objects: $(echo $glapi | wc -w)"
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 -dynamiclib -Wl,-all_load \
            -Wl,-undefined,error -Wl,-dead_strip_dylibs \
            $libs $glapi sweet_drm_mali.o mesa-stubs.o -framework IOKit -framework CoreFoundation -lc++ -lz \
            -o link-check.dylib 2>&1 | tee link.log | head -5
          grep -c "Undefined symbols\|duplicate symbol" link.log || true
          ls -l link-check.dylib || true
      - name: Summary
        if: always()
        run: |
          grep -E "error:|FAILED:" ninja.log | head -40 || true
          find build -name '*.a' -exec ls -l {} \; | sort -k5 -n | tail -30 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-build-logs
          path: |
            ninja.log
            link.log
            targets.txt
            build/meson-logs/meson-log.txt
            ios-cross.txt
            sweet_drm_mali.o
            mesa-stubs.o
          retention-days: 14
      # The OSMesa sources the GL layer has to be written against (Mesa 24.3.4 here, 25.0.x on the S7),
      # as they are after patch-mesa.py: small, and enough to write exact-match patches.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-osmesa-src
          path: |
            mesa/src/gallium/frontends/osmesa
            mesa/src/gallium/targets/osmesa
            mesa/src/gallium/auxiliary/target-helpers
            mesa/src/panfrost/lib/kmod/pan_kmod.c
            mesa/src/panfrost/lib/kmod/pan_kmod.h
            mesa/meson.build
            mesa/meson.options
          retention-days: 7
      # The OSMesa library itself: Panfrost first, softpipe as the fallback, GLES contexts allowed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j7-osmesa
          path: build/src/gallium/targets/osmesa/libOSMesa.8.dylib
          retention-days: 7
          if-no-files-found: warn
      # The GPU path as ONE image: the bridge between CoreAnimation's GLES renderer and Mesa (HakiOS's EAGL
      # bridge, tools/sweetgl-mali/eagl) linked into the OSMesa library itself, which is what the root's
      # /usr/lib/sweetgl.dylib placeholder (64 MiB, one file) can hold. DYLD_INSERT_LIBRARIES into
      # backboardd (boot arg sweetenv) loads it; its constructors set the bridge up.
      - name: EAGL bridge and one sweetgl.dylib
        run: |
          set -euo pipefail
          E=tools/sweetgl-mali/eagl
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -isysroot $SDK"
          mkdir -p out/obj
          osm=build/src/gallium/targets/osmesa/libOSMesa.8.dylib
          # the gl* entry points this OSMesa exports: the bridge's function table is made from them
          nm -gU "$osm" | awk '$3 ~ /^_gl/ { print substr($3, 2) }' > out/exported-gl.txt
          echo "exported gl functions: $(wc -l < out/exported-gl.txt)"
          python3 $E/mkeagl.py $E/eagl_slots.txt mesa/src/mapi/glapi/registry/gl.xml out/exported-gl.txt $E/eagl.c > out/eagl_gen.h
          $CC -O2 -g -w -Iout -I$E -I$E/include -c $E/eagl.c -o out/obj/eagl.o
          $CC -O2 -g -Wall -I$E -c $E/gl_sweet.c -o out/obj/gl_sweet.o
          $CC -O2 -g -Wall -c $E/ca_hooks.c -o out/obj/ca_hooks.o
          $CC -O2 -g -Wall -c $E/sweet_backboardd.c -o out/obj/sweet_backboardd.o
          $CC -O2 -g -Wall -c $E/sweet_crash.c -o out/obj/sweet_crash.o
          # Relink libOSMesa exactly as meson did, with the bridge objects added and a new name.
          python3 - <<'PY'
          import glob, os, shlex, subprocess
          target = 'src/gallium/targets/osmesa/libOSMesa.8.dylib'
          cmd = subprocess.check_output(['ninja', '-C', 'build', '-t', 'commands', target], text=True).strip().splitlines()[-1]
          toks = shlex.split(cmd)
          # The GL dispatch is a separate dylib in meson's link (libglapi.0.dylib, not on iOS): take the
          # objects it was built from instead, so everything is in this one image.
          # (os.listdir, not glob: two of the five are named '.._entry.c.o' and '.._u_current.c.o', and glob's
          # '*' never matches a name that starts with a dot, which left out entry_get_public and
          # _glapi_tls_Context and friends)
          objdir = 'build/src/mapi/shared-glapi/libglapi.0.dylib.p'
          glapi = sorted(os.path.join(objdir, f) for f in os.listdir(objdir) if f.endswith('.o'))
          assert len(glapi) == 5, glapi
          assert glapi, 'no libglapi objects'
          glapi = [os.path.abspath(o) for o in glapi]
          out, i = [], 0
          while i < len(toks):
              t = toks[i]
              if t in ('-o', '-install_name'):
                  i += 2
                  continue
              if t.startswith('-Wl,-install_name') or t.startswith('-Wl,-rpath'):
                  i += 1
                  continue
              if t.endswith('libglapi.0.dylib'):
                  out += glapi
                  i += 1
                  continue
              out.append(t)
              i += 1
          objs = [os.path.abspath('out/obj/' + o) for o in ('eagl.o', 'gl_sweet.o', 'ca_hooks.o', 'sweet_backboardd.o', 'sweet_crash.o')]
          out += ['-o', os.path.abspath('out/sweetgl-unpadded.dylib'), '-install_name', '/usr/lib/sweetgl.dylib'] + objs
          out += ['-framework', 'IOSurface', '-framework', 'CoreFoundation', '-lobjc']
          line = ' '.join(shlex.quote(t) for t in out)
          print(line)
          # The linker's own message goes last, where the end of the step log shows it, and to a file.
          r = subprocess.run(out, cwd='build', capture_output=True, text=True)
          text = r.stdout + r.stderr
          with open('out/relink.log', 'w') as f:
              f.write(line + '\n\n' + text)
          print('---- linker output (exit %d) ----' % r.returncode)
          print(text[:20000])
          raise SystemExit(r.returncode)
          PY
          codesign -f -s - out/sweetgl-unpadded.dylib
          lipo -info out/sweetgl-unpadded.dylib
          otool -L out/sweetgl-unpadded.dylib
          # Everything it loads must be on the phone already.
          bad=$(otool -L out/sweetgl-unpadded.dylib | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/)' || true)
          [ -z "$bad" ] || { echo "dependencies not in iOS: $bad"; exit 1; }
          size=$(stat -f %z out/sweetgl-unpadded.dylib)
          echo "sweetgl.dylib is $size bytes"
          [ "$size" -le 67108864 ] || { echo "over 64 MiB"; exit 1; }
          cp out/sweetgl-unpadded.dylib out/sweetgl.dylib
          # Pad after signing, as j7gpu-dylib does: the signature stays where the load command says.
          python3 -c "open('out/sweetgl.dylib','r+b').truncate(67108864)"
          shasum -a 256 out/sweetgl.dylib | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweetgl-relink-log
          path: |
            out/relink.log
            out/exported-gl.txt
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sweetgl-gpu-dylib
          path: |
            out/sweetgl.dylib
            out/SHA256SUMS
            out/exported-gl.txt
          compression-level: 9
          retention-days: 14
      # The Panfrost sources behind the first GPU crash (backboardd, NULL + 0x48 in the batch setup), as they
      # are in this tree after patch-mesa.py, to read what that field is and why it stays empty.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mesa-panfrost-src
          path: |
            mesa/src/gallium/drivers/panfrost/pan_job.c
            mesa/src/gallium/drivers/panfrost/pan_jm.c
            mesa/src/gallium/drivers/panfrost/pan_screen.c
            mesa/src/gallium/drivers/panfrost/pan_screen.h
            mesa/src/gallium/drivers/panfrost/pan_context.h
            mesa/src/gallium/drivers/panfrost/pan_resource.c
            mesa/src/panfrost/lib/pan_device.h
            mesa/src/panfrost/lib/pan_props.c
            mesa/src/panfrost/lib/pan_bo.c
            mesa/src/panfrost/lib/pan_bo.h
            mesa/src/panfrost/lib/kmod/pan_kmod.c
            mesa/src/panfrost/lib/kmod/pan_kmod.h
          if-no-files-found: warn
          retention-days: 7
